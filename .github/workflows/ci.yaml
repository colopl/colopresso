name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the older run of that pull request. Pushes to main and manual
# runs are grouped by commit, so none of them is cancelled or held back by a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Approval:
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.user.login == 'renovate[bot]' && 'renovate-ci-approval' || '' }}
    steps:
      - name: Approved
        run: echo "CI execution approved (or no approval gate required for this event)."
  Prepare:
    needs: Approval
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.changes.outputs.native }}
      emsdk_version: ${{ steps.get_emsdk_version.outputs.emsdk_version }}
      rust_stable: ${{ steps.get_rust_versions.outputs.rust_stable }}
      wasm_pack_version: ${{ steps.get_rust_versions.outputs.wasm_pack_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 2
      - name: Detect changes outside Electron
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A pull request that only touches the Electron app, the shared UI, the JS dependencies or
          # documents cannot change the library, the CLI, the WebAssembly builds or the Python wheels,
          # so those jobs are skipped for it; the Electron jobs and their E2E still run. Pushes and
          # manual runs always run everything. The checkout of a pull request is its merge commit,
          # whose first parent is the base branch.
          if test "${EVENT_NAME}" != "pull_request"; then
            echo "native=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD | tee "${RUNNER_TEMP}/changed-files.txt"
          if grep -qvE '^(app/|\.claude/|resources/|pages/|[^/]+\.md$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.prettierrc\.json$|\.github/renovate\.json$)' "${RUNNER_TEMP}/changed-files.txt"; then
            echo "native=true" >> "${GITHUB_OUTPUT}"
          else
            echo "native=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Test release metadata generator
        run: node --test "utils/create_macos_update_metadata.test.mjs" "utils/create_windows_update_metadata.test.mjs"
      - name: EMSDK require full checkout
        id: get_emsdk_version
        working-directory: 'third_party/emsdk'
        run: |
          git fetch --tags
          echo "emsdk_version=$(git describe --tags --abbrev=0)" >> "${GITHUB_OUTPUT}"
      - name: Get Rust versions from rust-toolchain.toml
        id: get_rust_versions
        run: |
          RUST_STABLE=$(grep -E '^channel\s*=' rust-toolchain.toml | sed 's/.*=\s*"\([^"]*\)".*/\1/')
          WASM_PACK=$(grep -E '^wasm-pack\s*=' rust-toolchain.toml | sed 's/.*=\s*"\([^"]*\)".*/\1/')
          echo "rust_stable=${RUST_STABLE}" >> "${GITHUB_OUTPUT}"
          echo "wasm_pack_version=${WASM_PACK}" >> "${GITHUB_OUTPUT}"
      - name: Dummy versioning
        run: |
          sed -i "s|/\* COLOPL_VERSION_START \*/.*/\* COLOPL_VERSION_END \*/|999999998|" "library/include/colopresso.h"
          sed -i "s|VERSION 0.0.0|VERSION 999.999.998|" "CMakeLists.txt"
          sed -i 's|"version": "0.0.0"|"version": "999.999.998"|' "package.json"
      - name: Tar dummy versioned code
        run: |
          tar -czf "../dummy-versioned-code.tar.gz" -C .. "$(basename "${PWD}")"
          mv "../dummy-versioned-code.tar.gz" "./dummy-versioned-code.tar.gz"
      - name: Upload versioned code
        uses: actions/upload-artifact@v7
        with:
          name: dummy-versioned-code
          path: ./dummy-versioned-code.tar.gz
          retention-days: 1
  LinuxAndWasm:
    name: LinuxAndWasm (${{ matrix.arch.name }}, ${{ matrix.mode }})
    needs: Prepare
    if: needs.Prepare.outputs.native == 'true'
    strategy:
      # Every mode is an independent check, so one failing must not cancel the others.
      fail-fast: false
      matrix:
        arch:
          - name: amd64
            platform: linux/amd64
            runs-on: ubuntu-26.04
          - name: arm64
            platform: linux/arm64
            runs-on: ubuntu-26.04-arm
        mode:
          - native
          - asan
          - ubsan
          - wasm
    runs-on: ${{ matrix.arch.runs-on }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - name: Download dummy versioned code
        uses: actions/download-artifact@v8
        with:
          name: dummy-versioned-code
          path: .
      - name: Extract dummy versioned code
        run: |
          tar -xzf "dummy-versioned-code.tar.gz" --strip-components=1
          rm -rf "dummy-versioned-code.tar.gz"
      - name: Restore libaom source
        uses: ./.github/actions/libaom-source
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The toolchain stage does not depend on the project sources, so its layers come from the
      # Actions cache unless the Dockerfile, rust-toolchain.toml or the emsdk submodule changed. The
      # four modes of an architecture build the same image; only the native job writes the cache, and
      # only outside pull requests, so pull requests reuse the image of main without adding to the
      # cache storage of the repository.
      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: toolchain
          build-args: |
            PLATFORM=${{ matrix.arch.platform }}
            ENABLE_VALGRIND=0
            ENABLE_CLANG=1
            ENABLE_EMSDK=1
            EMSDK_VERSION=${{ needs.Prepare.outputs.emsdk_version }}
          tags: ci
          load: true
          cache-from: type=gha,scope=ci-${{ matrix.arch.name }}
          cache-to: ${{ github.event_name != 'pull_request' && matrix.mode == 'native' && format('type=gha,scope=ci-{0},mode=max,ignore-error=true', matrix.arch.name) || '' }}
      # The objects of the third-party libraries (libaom, libavif, libwebp, ...) dominate the build.
      # The key changes with the submodules and the toolchain. A key is saved once, outside pull
      # requests; pull requests and later runs restore it (or the latest entry of the mode), so the
      # number of entries does not grow with the number of runs.
      - name: Resolve ccache key
        id: ccache_key
        run: |
          SUBMODULES="$(git ls-tree HEAD third_party/ | sha256sum | cut -c1-16)"
          echo "prefix=ccache-${{ runner.os }}-${{ matrix.arch.name }}-${{ matrix.mode }}-" >> "${GITHUB_OUTPUT}"
          echo "key=ccache-${{ runner.os }}-${{ matrix.arch.name }}-${{ matrix.mode }}-${SUBMODULES}-${{ hashFiles('Dockerfile', 'cmake/libaom.cmake') }}" >> "${GITHUB_OUTPUT}"
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ccache
          key: ${{ steps.ccache_key.outputs.key }}
          restore-keys: ${{ steps.ccache_key.outputs.prefix }}
      - name: Build and test
        env:
          MODE: ${{ matrix.mode }}
        run: |
          docker run \
            --rm \
            --volume "${PWD}:/workspace" \
            --workdir "/workspace" \
            --env MODE \
            --env CCACHE_DIR="/workspace/.cache/ccache" \
            --env CCACHE_BASEDIR="/workspace" \
            --env CCACHE_MAXSIZE="250M" \
            ci \
            /bin/bash -lc '
              set -e

              ccache --zero-stats > /dev/null
              LAUNCHER=(-DCMAKE_C_COMPILER_LAUNCHER="ccache" -DCMAKE_CXX_COMPILER_LAUNCHER="ccache")

              case "${MODE}" in
                native)
                  cmake -B "build" \
                    -DCMAKE_BUILD_TYPE="Release" \
                    -DCOLOPRESSO_USE_TESTS=ON \
                    -DCOLOPRESSO_USE_UTILS=ON \
                    -DCOLOPRESSO_USE_CLI=ON \
                    "${LAUNCHER[@]}"
                  cmake --build "build" --config "Release" --parallel="$(($(nproc)-1))"
                  ctest --test-dir "build" --output-on-failure --parallel
                  ;;
                asan | ubsan)
                  cmake -B "build" \
                    -DCMAKE_C_COMPILER="$(command -v "clang")" \
                    -DCMAKE_CXX_COMPILER="$(command -v "clang++")" \
                    -DCMAKE_BUILD_TYPE="Debug" \
                    -DCOLOPRESSO_USE_TESTS=ON \
                    -DCOLOPRESSO_USE_UTILS=ON \
                    -DCOLOPRESSO_USE_CLI=ON \
                    -DCOLOPRESSO_USE_${MODE^^}=ON \
                    "${LAUNCHER[@]}"
                  cmake --build "build" --config "Debug" --parallel="$(($(nproc)-1))"
                  ctest --test-dir "build" --output-on-failure --parallel
                  ;;
                wasm)
                  # emcc runs the compiler through this wrapper.
                  export EM_COMPILER_WRAPPER="ccache"
                  emcmake cmake -B "build" \
                    -DCMAKE_BUILD_TYPE="Release" \
                    -DCOLOPRESSO_NODE_BUILD=ON \
                    -DCOLOPRESSO_USE_TESTS=ON \
                    -DCOLOPRESSO_USE_UTILS=ON \
                    -DCOLOPRESSO_USE_CLI=ON
                  cmake --build "build" --target "pngx_bridge_build" --parallel="$(($(nproc)-1))"
                  if emnm "build/pngx_bridge/target/wasm32-unknown-emscripten/release/libpngx_bridge.a" | grep -Eq "(_Unwind_|__cxa_throw|__cxa_begin_catch|__gxx_personality_v0|__clang_call_terminate)"; then
                    echo "pngx_bridge archive still depends on unwind exception symbols"
                    exit 1
                  fi
                  cmake --build "build" --config "Release" --parallel="$(($(nproc)-1))"
                  ctest --test-dir "build" --output-on-failure --parallel
                  ;;
                *)
                  echo "Unknown mode: ${MODE}" >&2
                  exit 1
                  ;;
              esac

              ccache --show-stats
            '
      - name: Save ccache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/ccache
          key: ${{ steps.ccache_key.outputs.key }}
  Valgrind:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: Prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-26.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 720
    steps:
      - name: Download dummy versioned code
        uses: actions/download-artifact@v8
        with:
          name: dummy-versioned-code
          path: .
      - name: Extract dummy versioned code
        run: |
          tar -xzf "dummy-versioned-code.tar.gz" --strip-components=1
          rm -rf "dummy-versioned-code.tar.gz"
      - name: Detect Valgrind version
        id: valgrind
        run: |
          VALGRIND_VERSION="$(sed -n 's/^ARG VALGRIND_VERSION=//p' "Dockerfile" | head -n 1)"
          if test -z "${VALGRIND_VERSION}"; then
            echo "Error: VALGRIND_VERSION not found in Dockerfile." >&2
            exit 1
          fi
          echo "version=${VALGRIND_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Cache Valgrind tarball
        uses: actions/cache@v6
        with:
          path: valgrind-${{ steps.valgrind.outputs.version }}.tar.bz2
          key: valgrind-tarball-${{ steps.valgrind.outputs.version }}
      - name: Download Valgrind tarball if not cached
        env:
          VALGRIND_VERSION: ${{ steps.valgrind.outputs.version }}
        run: |
          VALGRIND_TARBALL="valgrind-${VALGRIND_VERSION}.tar.bz2"
          if test -f "${VALGRIND_TARBALL}"; then
            echo "Valgrind tarball restored from cache."
          else
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
              -o "${VALGRIND_TARBALL}" \
              "https://sourceware.org/pub/valgrind/valgrind-${VALGRIND_VERSION}.tar.bz2"
          fi
      - name: Restore libaom source
        uses: ./.github/actions/libaom-source
      - name: Build container
        run: |
          docker build \
            --file "Dockerfile" \
            --build-arg PLATFORM="${{ matrix.platform }}" \
            --build-arg ENABLE_VALGRIND="1" \
            --build-arg ENABLE_CLANG="0" \
            --build-arg ENABLE_EMSDK="0" \
            --target "builder" \
            --tag "valgrind" \
            .
      - name: Run Valgrind tests
        run: |
          docker run \
            --rm \
            --volume "${PWD}:/workspace" \
            --workdir "/workspace" \
            valgrind \
            /bin/bash -lc '
              set -e
              cmake -B "build" \
                -DCMAKE_BUILD_TYPE="Debug" \
                -DCOLOPRESSO_USE_VALGRIND=ON \
                -DCOLOPRESSO_USE_TESTS=ON \
                -DCOLOPRESSO_USE_UTILS=ON \
                -DCOLOPRESSO_USE_CLI=ON
              cmake --build "build" --config "Debug" --parallel="$(($(nproc)-1))"
              ctest --test-dir "build" --output-on-failure --parallel
            '
  WindowsElectron:
    name: WindowsElectron (${{ matrix.arch.electron }})
    needs: Prepare
    strategy:
      # One architecture failing (for example on a transient download error) must not cancel the other.
      fail-fast: false
      matrix:
        arch:
          - electron: x64
            cmake: x64
            runs-on: windows-latest
          - electron: arm64
            cmake: ARM64
            runs-on: windows-11-arm
    runs-on: ${{ matrix.arch.runs-on }}
    env:
      # electron-builder downloads its tools (such as NSIS) into ELECTRON_BUILDER_CACHE and the
      # Electron zip into the per-user cache of @electron/get (%LOCALAPPDATA%\electron\Cache). Both
      # are cached so the builds do not depend on GitHub serving them every time.
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Download dummy versioned code
        uses: actions/download-artifact@v8
        with:
          name: dummy-versioned-code
      - name: Extract versioned code
        run: |
          tar -xzf "dummy-versioned-code.tar.gz" --strip-components=1
          Remove-Item "dummy-versioned-code.tar.gz" -Force
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ needs.Prepare.outputs.rust_stable }}
      - name: Resolve Electron versions for the download cache
        id: electron_versions
        shell: bash
        run: |
          echo "electron=$(sed -n 's/^  electron@\([0-9][^:(]*\):$/\1/p' pnpm-lock.yaml | head -n 1)" >> "${GITHUB_OUTPUT}"
          echo "builder=$(sed -n 's/^  app-builder-lib@\([0-9][^:(]*\):$/\1/p' pnpm-lock.yaml | head -n 1)" >> "${GITHUB_OUTPUT}"
      - name: Restore Electron downloads
        id: electron_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            .cache/electron-builder
          key: electron-downloads-${{ runner.os }}-${{ matrix.arch.electron }}-${{ steps.electron_versions.outputs.electron }}-${{ steps.electron_versions.outputs.builder }}
      # If the API fails as well, electron-builder still tries its own (anonymous) download.
      - name: Fetch Electron through the GitHub API
        continue-on-error: true
        uses: ./.github/actions/electron-download
        with:
          version: ${{ steps.electron_versions.outputs.electron }}
          arch: ${{ matrix.arch.electron }}
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('library/pngx_bridge/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Restore libaom source
        uses: ./.github/actions/libaom-source
      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Build Electron app (native addon)
        shell: pwsh
        run: |
          cmake -B "build" -A "${{ matrix.arch.cmake }}" -DCOLOPRESSO_ELECTRON_APP=ON -DCOLOPRESSO_ELECTRON_TARGETS="--win" -DCOLOPRESSO_ELECTRON_ARCH="${{ matrix.arch.electron }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "build" --config "Release" --parallel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Saved as soon as the build has downloaded everything, so a later failure (tests, E2E) does
      # not throw the downloads away.
      - name: Save Electron downloads
        if: steps.electron_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            .cache/electron-builder
          key: ${{ steps.electron_cache.outputs.cache-primary-key }}
      - name: Test native addon
        shell: pwsh
        run: node --test "app/electron/native/colopresso_native.test.mjs"
        env:
          COLOPRESSO_NATIVE_ADDON_PATH: ${{ github.workspace }}/build/electron/native/colopresso_native.node
          COLOPRESSO_TEST_ASSETS_DIR: ${{ github.workspace }}/assets
      - name: Electron E2E
        shell: bash
        timeout-minutes: 45
        run: bash "app/electron/e2e/smoke.sh" "${RUNNER_TEMP}/colopresso-e2e"
        env:
          COLOPRESSO_E2E_LAUNCH_ATTEMPTS: '3'
          DEBUG: 'pw:browser,pw:protocol'
      - name: Upload Electron E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electron-e2e-windows-${{ matrix.arch.electron }}
          path: |
            ${{ runner.temp }}/colopresso-e2e/shots
            ${{ runner.temp }}/colopresso-e2e/driver.log
            ${{ runner.temp }}/colopresso-e2e/driver.stderr.log
          if-no-files-found: ignore
  macOSElectron:
    name: macOSElectron (${{ matrix.arch.name }})
    needs: Prepare
    strategy:
      # One architecture failing (for example on a transient download error) must not cancel the other.
      fail-fast: false
      matrix:
        arch:
          - name: Apple Silicon
            slug: apple-silicon
            electron: arm64
            runs-on: macos-26
            e2e: true
          # On the Intel runner the app repeatedly stopped responding during the E2E, in some runs in
          # all three attempts, so Intel only builds the app and tests the native addon.
          - name: Intel
            slug: intel
            electron: x64
            runs-on: macos-26-intel
            e2e: false
    runs-on: ${{ matrix.arch.runs-on }}
    env:
      # electron-builder downloads its tools (such as the DMG builder) into ELECTRON_BUILDER_CACHE and
      # the Electron zip into the per-user cache of @electron/get (~/Library/Caches/electron). Both
      # are cached so the builds do not depend on GitHub serving them every time.
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Download dummy versioned code
        uses: actions/download-artifact@v8
        with:
          name: dummy-versioned-code
          path: .
      - name: Extract dummy versioned code
        run: |
          tar -xzf "dummy-versioned-code.tar.gz" --strip-components=1
          rm -rf "dummy-versioned-code.tar.gz"
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ needs.Prepare.outputs.rust_stable }}
      - name: Resolve Electron versions for the download cache
        id: electron_versions
        shell: bash
        run: |
          echo "electron=$(sed -n 's/^  electron@\([0-9][^:(]*\):$/\1/p' pnpm-lock.yaml | head -n 1)" >> "${GITHUB_OUTPUT}"
          echo "builder=$(sed -n 's/^  app-builder-lib@\([0-9][^:(]*\):$/\1/p' pnpm-lock.yaml | head -n 1)" >> "${GITHUB_OUTPUT}"
      - name: Restore Electron downloads
        id: electron_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/electron
            .cache/electron-builder
          key: electron-downloads-${{ runner.os }}-${{ matrix.arch.electron }}-${{ steps.electron_versions.outputs.electron }}-${{ steps.electron_versions.outputs.builder }}
      # If the API fails as well, electron-builder still tries its own (anonymous) download.
      - name: Fetch Electron through the GitHub API
        continue-on-error: true
        uses: ./.github/actions/electron-download
        with:
          version: ${{ steps.electron_versions.outputs.electron }}
          arch: ${{ matrix.arch.electron }}
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('library/pngx_bridge/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Restore libaom source
        uses: ./.github/actions/libaom-source
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Electron app (native addon)
        run: |
          cmake -B "build" -DCOLOPRESSO_ELECTRON_APP=ON -DCOLOPRESSO_ELECTRON_TARGETS="--mac" -DCOLOPRESSO_ELECTRON_ARCH="${{ matrix.arch.electron }}" ${{ matrix.arch.electron == 'x64' && '-DAOM_TARGET_CPU=generic' || '' }}
          cmake --build "build" --config "Release" --parallel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Saved as soon as the build has downloaded everything, so a later failure (tests, E2E) does
      # not throw the downloads away.
      - name: Save Electron downloads
        if: steps.electron_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Caches/electron
            .cache/electron-builder
          key: ${{ steps.electron_cache.outputs.cache-primary-key }}
      - name: Test native addon
        run: node --test "app/electron/native/colopresso_native.test.mjs"
        env:
          COLOPRESSO_NATIVE_ADDON_PATH: ${{ github.workspace }}/build/electron/native/colopresso_native.node
          COLOPRESSO_TEST_ASSETS_DIR: ${{ github.workspace }}/assets
      - name: Electron E2E
        if: matrix.arch.e2e
        timeout-minutes: 45
        run: bash "app/electron/e2e/smoke.sh" "${RUNNER_TEMP}/colopresso-e2e"
        env:
          COLOPRESSO_E2E_LAUNCH_ATTEMPTS: '3'
          DEBUG: 'pw:browser,pw:protocol'
      - name: Upload Electron E2E results
        if: always() && matrix.arch.e2e
        uses: actions/upload-artifact@v7
        with:
          name: electron-e2e-macos-${{ matrix.arch.slug }}
          path: |
            ${{ runner.temp }}/colopresso-e2e/shots
            ${{ runner.temp }}/colopresso-e2e/driver.log
            ${{ runner.temp }}/colopresso-e2e/driver.stderr.log
          if-no-files-found: ignore
  WindowsCLI:
    name: WindowsCLI (x64)
    needs: Prepare
    if: needs.Prepare.outputs.native == 'true'
    runs-on: windows-latest
    steps:
      - name: Download dummy versioned code
        uses: actions/download-artifact@v8
        with:
          name: dummy-versioned-code
      - name: Extract versioned code
        run: |
          tar -xzf "dummy-versioned-code.tar.gz" --strip-components=1
          Remove-Item "dummy-versioned-code.tar.gz" -Force
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('library/pngx_bridge/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Restore libaom source
        uses: ./.github/actions/libaom-source
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE="Release" -DCOLOPRESSO_USE_CLI=ON -DCOLOPRESSO_USE_TESTS=ON
      - name: Build
        run: cmake --build "build" --config "Release" --parallel
      - name: Test
        run: ctest --test-dir "build" --build-config "Release" --output-on-failure --parallel
      - name: Test CLI
        run: build\cli\Release\colopresso.exe --version
  macOSCLI:
    name: macOSCLI (${{ matrix.arch.name }})
    needs: Prepare
    if: needs.Prepare.outputs.native == 'true'
    strategy:
      matrix:
        arch:
          - name: Apple Silicon
            rust_target: aarch64-apple-darwin
            runs-on: macos-26
          - name: Intel
            rust_target: x86_64-apple-darwin
            runs-on: macos-26-intel
    runs-on: ${{ matrix.arch.runs-on }}
    steps:
      - name: Download dummy versioned code
        uses: actions/download-artifact@v8
        with:
          name: dummy-versioned-code
          path: .
      - name: Extract dummy versioned code
        run: |
          tar -xzf "dummy-versioned-code.tar.gz" --strip-components=1
          rm -rf "dummy-versioned-code.tar.gz"
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('library/pngx_bridge/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Restore libaom source
        uses: ./.github/actions/libaom-source
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCOLOPRESSO_USE_CLI=ON \
            -DCOLOPRESSO_USE_TESTS=ON \
            ${{ matrix.arch.name == 'Intel' && '-DAOM_TARGET_CPU="generic"' || '' }}
      - name: Build
        run: cmake --build "build" --config "Release" --parallel
      - name: Test
        run: ctest --test-dir "build" --output-on-failure --parallel
      - name: Test CLI
        run: ./build/cli/colopresso --version
  LinuxCLI:
    name: LinuxCLI (${{ matrix.arch }})
    needs: Prepare
    if: needs.Prepare.outputs.native == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-26.04
          - arch: arm64
            runs-on: ubuntu-26.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - name: Download dummy versioned code
        uses: actions/download-artifact@v8
        with:
          name: dummy-versioned-code
          path: .
      - name: Extract dummy versioned code
        run: |
          tar -xzf "dummy-versioned-code.tar.gz" --strip-components=1
          rm -rf "dummy-versioned-code.tar.gz"
      - name: Restore libaom source
        uses: ./.github/actions/libaom-source
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.alpine
          tags: cli
          load: true
          cache-from: type=gha,scope=cli-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope=cli-{0},mode=max,ignore-error=true', matrix.arch) || '' }}
      - name: Resolve ccache key
        id: ccache_key
        run: |
          SUBMODULES="$(git ls-tree HEAD third_party/ | sha256sum | cut -c1-16)"
          echo "prefix=ccache-${{ runner.os }}-${{ matrix.arch }}-cli-" >> "${GITHUB_OUTPUT}"
          echo "key=ccache-${{ runner.os }}-${{ matrix.arch }}-cli-${SUBMODULES}-${{ hashFiles('Dockerfile.alpine', 'cmake/libaom.cmake') }}" >> "${GITHUB_OUTPUT}"
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ccache
          key: ${{ steps.ccache_key.outputs.key }}
          restore-keys: ${{ steps.ccache_key.outputs.prefix }}
      - name: Build CLI in container
        run: |
          docker run \
            --rm \
            --volume "${PWD}:/workspace" \
            --workdir "/workspace" \
            --env CCACHE_DIR="/workspace/.cache/ccache" \
            --env CCACHE_BASEDIR="/workspace" \
            --env CCACHE_MAXSIZE="250M" \
            "cli" \
            /bin/sh -c '
              set -e
              ccache --zero-stats > /dev/null
              cmake -B build \
                -DCMAKE_BUILD_TYPE="Release" \
                -DCMAKE_EXE_LINKER_FLAGS="-static" \
                -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
                -DCMAKE_CXX_COMPILER_LAUNCHER="ccache" \
                -DCOLOPRESSO_USE_CLI=ON \
                -DCOLOPRESSO_USE_TESTS=ON
              cmake --build "build" --config "Release" --target "colopresso_cli" --parallel="$(($(nproc)-1))"
              ccache --show-stats
              strip build/cli/colopresso
              build/cli/colopresso --version
              build/cli/colopresso --verbose --format=webp assets/example.png "/tmp/example.webp"
              build/cli/colopresso --verbose --format=avif assets/example.png "/tmp/example.avif"
              build/cli/colopresso --verbose --format=pngx assets/example.png "/tmp/example.png"
            '
      - name: Save ccache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/ccache
          key: ${{ steps.ccache_key.outputs.key }}
      - name: Test binary in minimal container
        run: |
          docker run \
            --rm \
            --volume "${PWD}/build/cli/colopresso:/colopresso:ro" \
            --volume "${PWD}/assets:/assets:ro" \
            alpine:latest \
            /bin/sh -c '
              set +e
              /colopresso --verbose --format=pngx "/assets/increase.png" "/tmp/increase.png"
              EXIT_CODE=$?
              if test ${EXIT_CODE} -ne 2; then
                echo "Error: Expected exit code 2, got ${EXIT_CODE}"
                exit 1
              fi

              set -e
              /colopresso --version
              /colopresso --verbose --format=webp "/assets/example.png" "/tmp/example.webp"
              /colopresso --verbose --format=avif "/assets/example.png" "/tmp/example.avif"
              /colopresso --verbose --format=pngx "/assets/example.png" "/tmp/example.png"
            '
          docker run \
            --rm \
            --volume "${PWD}/build/cli/colopresso:/colopresso:ro" \
            --volume "${PWD}/assets:/assets:ro" \
            busybox:musl \
            /bin/sh -c '
              set +e
              /colopresso --verbose --format=pngx "/assets/increase.png" "/tmp/increase.png"
              EXIT_CODE=$?
              if test ${EXIT_CODE} -ne 2; then
                echo "Error: Expected exit code 2, got ${EXIT_CODE}"
                exit 1
              fi

              set -e
              /colopresso --version
              /colopresso --verbose --format=webp "/assets/example.png" "/tmp/example.webp"
              /colopresso --verbose --format=avif "/assets/example.png" "/tmp/example.avif"
              /colopresso --verbose --format=pngx "/assets/example.png" "/tmp/example.png"
            '
  PythonWheel:
    name: PythonWheel (${{ matrix.os }}, ${{ matrix.arch }})
    needs: Prepare
    if: needs.Prepare.outputs.native == 'true'
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runs-on: ubuntu-26.04
            cibw_archs_linux: x86_64
          - os: linux
            arch: arm64
            runs-on: ubuntu-26.04-arm
            cibw_archs_linux: aarch64
          - os: windows
            arch: x64
            runs-on: windows-latest
            cibw_archs_windows: AMD64
          - os: macos
            arch: Intel
            runs-on: macos-26-intel
            cibw_archs_macos: x86_64
          - os: macos
            arch: Apple Silicon
            runs-on: macos-26
            cibw_archs_macos: arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Download dummy versioned code
        uses: actions/download-artifact@v8
        with:
          name: dummy-versioned-code
          path: .
      - name: Extract dummy versioned code (Unix)
        if: matrix.os != 'windows'
        run: |
          tar -xzf "dummy-versioned-code.tar.gz" --strip-components=1
          rm -rf "dummy-versioned-code.tar.gz"
      - name: Extract dummy versioned code (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          tar -xzf "dummy-versioned-code.tar.gz" --strip-components=1
          Remove-Item "dummy-versioned-code.tar.gz" -Force
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
      - name: Cache Cargo registry
        if: matrix.os != 'linux'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('library/pngx_bridge/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Restore libaom source
        uses: ./.github/actions/libaom-source
      # If the API fails as well, cibuildwheel still tries its own (anonymous) download.
      - name: Fetch virtualenv for cibuildwheel through the GitHub API
        if: matrix.os != 'linux'
        continue-on-error: true
        uses: ./.github/actions/cibuildwheel-virtualenv
      - name: Build wheels
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs_linux }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.cibw_archs_windows }}
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_archs_macos }}
        run: python -m cibuildwheel python --output-dir python/dist
      - name: Test wheel (Windows/macOS)
        if: matrix.os == 'windows' || matrix.os == 'macos'
        shell: bash
        run: |
          set -e
          WHEEL=$(ls python/dist/*.whl | grep -E "cp310" | head -n 1)
          if test -z "${WHEEL}"; then
            echo "No cp310 wheel found, using first available wheel"
            WHEEL=$(ls python/dist/*.whl | head -n 1)
          fi
          echo "Installing wheel: ${WHEEL}"
          python -m pip install "${WHEEL}"

          echo "Running PNG256 encode test..."
          python -c "
          import colopresso
          from colopresso import Config, PngxLossyType, encode_pngx

          print(f'colopresso version: {colopresso.get_version()}')
          print(f'libpng version: {colopresso.get_libpng_version()}')

          with open('assets/example.png', 'rb') as f:
              png_data = f.read()
          print(f'Original PNG size: {len(png_data)} bytes')

          config = Config()
          config.pngx_lossy_enable = True
          config.pngx_lossy_type = PngxLossyType.PALETTE256

          encoded = encode_pngx(png_data, config)
          print(f'Encoded PNG256 size: {len(encoded)} bytes')

          if len(encoded) == 0:
              raise RuntimeError('Encoded data is empty')

          # Verify PNG signature
          if encoded[:8] != b'\\x89PNG\\r\\n\\x1a\\n':
              raise RuntimeError('Invalid PNG signature in output')

          print('PNG256 encode test passed!')
          "
      - name: Test wheel (Linux manylinux)
        if: matrix.os == 'linux'
        run: |
          WHEEL=$(ls python/dist/*.whl | grep -E "manylinux.*cp310" | head -n 1)
          if test -z "${WHEEL}"; then
            echo "No manylinux cp310 wheel found, using first manylinux wheel"
            WHEEL=$(ls python/dist/*.whl | grep "manylinux" | head -n 1)
          fi
          echo "Testing manylinux wheel: ${WHEEL}"
          docker run \
            --rm \
            --volume "${PWD}:/workspace:ro" \
            --workdir "/workspace" \
            python:latest \
            bash -c "
              set -e
              pip install /workspace/${WHEEL}
              python -c \"
          import colopresso
          from colopresso import Config, PngxLossyType, encode_pngx

          print(f'colopresso version: {colopresso.get_version()}')
